[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@uniswap/v4-core/=lib/v4-periphery/lib/v4-core/",
    "v4-core/=lib/v4-periphery/lib/v4-core/src/",
    "v4-core-test/=lib/v4-periphery/lib/v4-core/test/",
    "solmate/=lib/v4-periphery/lib/v4-core/lib/solmate/",
    "@openzeppelin/contracts/=lib/v4-periphery/lib/v4-core/lib/openzeppelin-contracts/contracts/",
    "reactive-lib/=lib/reactive-lib-omni/src/",
    "v4-periphery/=lib/v4-periphery/",
]

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
unichain_sepolia = "https://sepolia.unichain.org"
lasna = "https://lasna-rpc.rnk.dev/"

[lint]
lint_on_build = false

[fuzz]
runs = 256
